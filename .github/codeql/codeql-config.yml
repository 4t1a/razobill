name: "Razobill CodeQL Analysis Configuration"

# Exclude vendored thirdparty libraries from analysis
paths-ignore:
  - "thirdparty/**"

# Filter out false-positive quality and vendor queries
query-filters:
  - exclude:
      id: cpp/unused-static-function
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/stack-address-escape
  - exclude:
      id: cpp/path-injection
