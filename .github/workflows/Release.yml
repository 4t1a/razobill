name: Release Engineering & Binary Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      versionBump:
        description: 'SemVer release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-lint:
    name: Lint Commits & Verify ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Verifying release commit message:"
          echo "${MSG}"
          if [[ ! "${MSG}" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: ]]; then
            echo "::error::Commit message does not match Conventional Commits format"
            exit 1
          fi
          echo "Commit message adheres to Conventional Commits specification."

      - name: Validate SemVer Invariant
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Building librazobill version: ${VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

  build-matrix:
    name: Build & Test (${{ matrix.os }})
    needs: validate-and-lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11 duckdb pytest ninja

      - name: Set up C++20 Compiler
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Libraries & Extensions
        run: cmake --build build --config Release

      - name: Run Test Suites
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run Python Verification Suite
        run: python lib/python/tests/TestPyRazobill.py

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p release-staging
          find build -maxdepth 1 -name "*.duckdb_extension" -exec cp {} release-staging/ \;
          find lib/python/pyrazobill -maxdepth 1 -name "Core*" -exec cp {} release-staging/ \;

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: release-staging/*
          if-no-files-found: ignore

  publish-release:
    name: Sign & Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate SLSA Attestations & Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: librazobill v${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-binaries/*
            docs/governance/SbomSpdx.json
